<!DOCTYPE html>
<html lang="th">
<head>
    <!-- เพิ่มไลบรารีสำหรับสร้างไฟล์ Excel (.xlsx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLab Training - My Records</title>
    <style>
        /* ธีม Console Gaming UI */
        body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background-color: #0F172A; color: #1E293B; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 600px; background-color: #FFFFFF; box-shadow: 0 0 40px rgba(56, 189, 248, 0.15); display: flex; flex-direction: column; position: relative; }
        
        .logo-container { text-align: center; padding-top: 25px; padding-bottom: 15px; background-color: #FFFFFF; }
        .logo-container img { max-height: 75px; width: auto; object-fit: contain; }
        
        .header { background: linear-gradient(135deg, #0F172A, #1D4ED8); color: #FFFFFF; padding: 20px; text-align: center; border-bottom: 3px solid #10B981; }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        .content { padding: 25px; flex-grow: 1; background-color: #F8FAFC; }
        
        .btn-primary { 
            width: 100%; background: linear-gradient(90deg, #1D4ED8, #2563EB); color: #FFFFFF; border: none; padding: 15px; border-radius: 8px; 
            font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 10px; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }
        .btn-primary:hover { background: linear-gradient(90deg, #2563EB, #38BDF8); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); transform: translateY(-2px); }
        
        .btn-secondary { 
            background-color: #64748B; color: #FFFFFF; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom:10px; 
            box-shadow: 0 4px 10px rgba(100, 116, 139, 0.2); transition: all 0.3s ease; 
        }
        .btn-secondary:hover { background-color: #38BDF8; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); transform: translateY(-2px); }
        
        /* สไตล์ชุดกรองช่วงเวลา */
        .filter-bar { background: #FFFFFF; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #E2E8F0; box-shadow: 0 2px 8px rgba(0,0,0,0.02);}
        .filter-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
        .filter-col { flex: 1; }
        .filter-col label { font-size: 0.85rem; color: #475569; font-weight: bold; display: block; margin-bottom: 5px; }
        .filter-col input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #CBD5E1; box-sizing: border-box; font-family: inherit;}
        .filter-col input:focus { border-color: #38BDF8; outline: none; box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }

        /* ตาราง */
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; font-size: 0.9rem; background-color: #FFFFFF; border-radius: 8px; overflow: hidden; border: 1px solid #E2E8F0; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #E2E8F0; text-align: left; color: #334155; }
        th { background-color: #0F172A; color: #FFFFFF; border-bottom: none; font-weight: 600; letter-spacing: 0.5px;}
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #F8FAFC; }

        #overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.92); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; border-radius: inherit;}
        .spinner { border: 5px solid #E2E8F0; border-top: 5px solid #38BDF8; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="overlay"><div class="spinner"></div><h2 style="color:#1E4ED8; margin-top:15px; font-weight:800;" id="overlay-text">LOADING...</h2></div>
        
        <div class="logo-container">
            <img src="https://storage.googleapis.com/nh-uat-corp/2024/6/update_N_Health_d5a05fd0a9/update_N_Health_d5a05fd0a9.png" alt="N Health Logo">
        </div>
        <div class="header">
            <h1>ระบบตรวจสอบประวัติ<br><small style="font-size:0.95rem; font-weight:normal; color:#38BDF8; letter-spacing: 2px;">BML/NNG Communiction CENTER</small></h1>
        </div>

        <div class="content">
            <!-- User Profile Bar -->
            <div style="background-color: #FFFFFF; padding: 15px; border-radius: 10px; margin-bottom: 25px; overflow: hidden; border: 2px solid #E2E8F0; display:flex; justify-content:space-between; align-items:center;">
                <div style="font-weight: 800; color: #1E293B; font-size:1.1rem;" id="user-name">กำลังโหลดข้อมูล...</div>
            </div>

            <button class="btn-secondary" style="width:auto;" onclick="goToMainMenu()">⬅️ กลับหน้าหลัก</button>
            <h3 style="color:#0F172A; font-weight:800; margin-top: 20px;">📊 ประวัติการเข้าร่วมสื่อสารของคุณ</h3>
            
            <div class="filter-bar">
                <div class="filter-row">
                    <div class="filter-col"><label>เริ่มวันที่:</label><input type="date" id="filter-start"></div>
                    <div class="filter-col"><label>ถึงวันที่:</label><input type="date" id="filter-end"></div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button style="flex:1; padding: 10px; background: #2563EB; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#1D4ED8'" onmouseout="this.style.backgroundColor='#2563EB'" onclick="renderTable()">🔍 กรองข้อมูล</button>
                    <button style="flex:1; padding: 10px; background: #94A3B8; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#64748B'" onmouseout="this.style.backgroundColor='#94A3B8'" onclick="clearFilter()">ล้างค่า</button>
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-bottom: 15px;">
                <button class="btn-secondary" style="margin-bottom:0; background:#38BDF8;" onmouseover="this.style.backgroundColor='#0EA5E9'" onmouseout="this.style.backgroundColor='#38BDF8'" onclick="exportExcel('download')">📥 โหลด EXCEL</button>
                <button class="btn-secondary" style="margin-bottom:0;" onclick="exportExcel('email')">✉️ ส่งเข้าอีเมล</button>
            </div>

            <div style="background-color: #F0FDF4; border-left: 5px solid #10B981; padding: 12px; margin-bottom: 15px; border-radius:4px;">
                <strong style="color: #064E3B;">ชั่วโมงสะสม (ตามที่กรอง): </strong> <span id="total-hours" style="color: #047857; font-size: 1.3rem; font-weight:900;">0</span> ชม.
            </div>
            
            <div style="overflow-x: auto;">
                <table id="records-table">
                    <thead><tr><th>วันที่ลงนาม</th><th>รหัส</th><th>หัวข้อ</th><th>สถานะ</th><th>ชั่วโมง</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqF92ZskKUgd398CIP0Np1yEYozv4_ew7wJ9IicnEtDCxefZb4zVTGAxo-7WB9zxIT/exec"; // นำ URL ของ Web App มาใส่ตรงนี้
        
        let currentUser = { id: "", name: "", role: "" };
        let userRecordsData = [];

        function showOverlay(text) { document.getElementById('overlay-text').innerText = text; document.getElementById('overlay').style.display = 'flex'; }
        function hideOverlay() { document.getElementById('overlay').style.display = 'none'; }
        function goToMainMenu() { window.location.href = "https://rb508411.github.io/bml_temp/LongName_BML.html"; }

        function sendLog(actionName, detailsStr) {
            if(!currentUser.id) return;
            fetch(`${SCRIPT_URL}?action=logActivity&empId=${currentUser.id}&activity=${encodeURIComponent(actionName)}&details=${encodeURIComponent(detailsStr)}`).catch(()=>{});
        }

        window.onload = function() {
            // เช็กข้อมูล Login จาก localStorage
            const empId = localStorage.getItem('bml_emp_id');
            const empName = localStorage.getItem('bml_emp_name');
            const empRole = localStorage.getItem('bml_emp_role');
            
            if(!empId) {
                alert("กรุณาเข้าสู่ระบบก่อนใช้งาน");
                window.location.href = "https://rb508411.github.io/bml_temp/LongName_BML.html"; 
                return;
            }
            
            currentUser = { id: empId, name: empName, role: empRole };
            document.getElementById('user-name').innerText = `${empName} (${empId})`;
            
            // ดึงข้อมูลประวัติทันทีที่โหลดหน้าเสร็จ
            fetchRecords();
        };

        async function fetchRecords() {
            showOverlay("FETCHING DATA...");
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getRecords&empId=${currentUser.id}`);
                const data = await res.json();
                if(data.success) {
                    userRecordsData = data.records;
                    clearFilter(); // สั่งให้ render table ครั้งแรก
                } else {
                    alert("ไม่สามารถดึงข้อมูลได้: " + data.message);
                }
            } catch(e) { alert("เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว"); }
            hideOverlay();
        }

        function clearFilter() {
            document.getElementById('filter-start').value = "";
            document.getElementById('filter-end').value = "";
            renderTable();
        }

        function renderTable() {
            const startStr = document.getElementById('filter-start').value;
            const endStr = document.getElementById('filter-end').value;
            
            let filteredRecords = userRecordsData;
            
            if (startStr || endStr) {
                const startDate = startStr ? new Date(startStr) : null;
                if(startDate) startDate.setHours(0,0,0,0);
                const endDate = endStr ? new Date(endStr) : null;
                if(endDate) endDate.setHours(23,59,59,999);
                
                filteredRecords = userRecordsData.filter(r => {
                    const rDate = new Date(r.rawDate);
                    if (startDate && rDate < startDate) return false;
                    if (endDate && rDate > endDate) return false;
                    return true;
                });
            }

            let totalHrs = 0;
            const tbody = document.querySelector('#records-table tbody');
            tbody.innerHTML = "";
            
            if(filteredRecords.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>ไม่พบข้อมูลการสื่อสารในช่วงเวลานี้</td></tr>";
            } else {
                filteredRecords.forEach(r => {
                    totalHrs += r.period;
                    tbody.innerHTML += `<tr>
                        <td>${r.date}</td>
                        <td><b style="color:#1D4ED8;">${r.code}</b></td>
                        <td>${r.topic}</td>
                        <td>${r.status}</td>
                        <td style="font-weight:bold; color:#047857;">${r.period}</td>
                    </tr>`;
                });
            }
            document.getElementById('total-hours').innerText = totalHrs;
        }

        async function exportExcel(method) {
            const startStr = document.getElementById('filter-start').value;
            const endStr = document.getElementById('filter-end').value;
            
            let dateLabel = "AllRecords";
            if(startStr && endStr) dateLabel = `${startStr}_to_${endStr}`;
            else if(startStr) dateLabel = `From_${startStr}`;
            else if(endStr) dateLabel = `Until_${endStr}`;

            if (method === 'download') {
                sendLog("Export Data", `ดาวน์โหลดประวัติส่วนตัวลงเครื่อง`);
                let filteredRecords = userRecordsData;
                
                if (startStr || endStr) {
                    const startDate = startStr ? new Date(startStr) : null;
                    if(startDate) startDate.setHours(0,0,0,0);
                    const endDate = endStr ? new Date(endStr) : null;
                    if(endDate) endDate.setHours(23,59,59,999);
                    
                    filteredRecords = userRecordsData.filter(r => {
                        const rDate = new Date(r.rawDate);
                        if (startDate && rDate < startDate) return false;
                        if (endDate && rDate > endDate) return false;
                        return true;
                    });
                }
                
                // ใช้ SheetJS สร้างไฟล์ .xlsx
                let dataToExport = [ ["วันที่ลงนาม", "รหัส", "หัวข้อ", "สถานะ", "ชั่วโมง"] ];
                filteredRecords.forEach(r => { 
                    dataToExport.push([r.date, r.code, r.topic, r.status, r.period]); 
                });
                
                const ws = XLSX.utils.aoa_to_sheet(dataToExport);
                ws['!cols'] = [{wch: 20}, {wch: 15}, {wch: 40}, {wch: 20}, {wch: 10}];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "MyTraining");
                
                const downloadFileName = `${currentUser.id}_TrainingRecords_${dateLabel}.xlsx`;
                XLSX.writeFile(wb, downloadFileName);
                
            } else if (method === 'email') {
                const targetEmail = prompt("กรุณากรอกอีเมลที่ต้องการให้จัดส่งไฟล์ประวัติ:", "");
                if (!targetEmail) return;

                showOverlay("SENDING EMAIL...");
                sendLog("Export Data", `ส่งเข้าอีเมลไปที่ ${targetEmail}`);
                try {
                    const res = await fetch(`${SCRIPT_URL}?action=emailExport&empId=${currentUser.id}&startDate=${startStr}&endDate=${endStr}&email=${encodeURIComponent(targetEmail)}`);
                    const data = await res.json();
                    if(data.success) alert(`✅ ส่งไฟล์เข้าอีเมล ${targetEmail} เรียบร้อยแล้ว`);
                    else alert("❌ ผิดพลาด: " + data.message);
                } catch(e) { alert("เชื่อมต่อล้มเหลว"); }
                hideOverlay();
            }
        }
    </script>
</body>
</html>
