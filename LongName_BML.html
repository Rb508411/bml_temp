<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLab Training - Login</title>
    <style>
        /* ธีม Console Gaming UI */
        body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background-color: #0F172A; color: #1E293B; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 600px; background-color: #FFFFFF; box-shadow: 0 0 40px rgba(56, 189, 248, 0.15); display: flex; flex-direction: column; position: relative; }
        
        .logo-container { text-align: center; padding-top: 25px; padding-bottom: 15px; background-color: #FFFFFF; }
        .logo-container img { max-height: 75px; width: auto; object-fit: contain; }
        
        .header { background: linear-gradient(135deg, #0F172A, #1D4ED8); color: #FFFFFF; padding: 20px; text-align: center; border-bottom: 3px solid #10B981; }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        .content { padding: 25px; flex-grow: 1; background-color: #F8FAFC; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #334155; font-size: 0.95rem; }
        .form-group input { width: 100%; padding: 12px 15px; border: 2px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; font-size: 1.1rem; color: #0F172A; background-color: #FFFFFF; transition: all 0.3s ease; text-align: center; letter-spacing: 1px;}
        .form-group input:focus { border-color: #38BDF8; outline: none; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        
        .btn-primary { width: 100%; background: linear-gradient(90deg, #1D4ED8, #2563EB); color: #FFFFFF; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 10px; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .btn-primary:hover { background: linear-gradient(90deg, #2563EB, #38BDF8); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); transform: translateY(-2px); }
        
        .btn-logout { background-color: #94A3B8; color: #FFFFFF; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
        .btn-logout:hover { background-color: #64748B; }
        
        .view-section { display: none; }
        .active-view { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Menu Links */
        .card-menu { display: block; text-decoration: none; background-color: #FFFFFF; border: 2px solid #E2E8F0; border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 15px; font-weight: 800; color: #1E293B; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.04); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .card-menu:hover { border-color: #38BDF8; background-color: #F0F9FF; color: #0EA5E9; box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3); transform: scale(1.03); }
        
        #overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.92); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; border-radius: inherit;}
        .spinner { border: 5px solid #E2E8F0; border-top: 5px solid #38BDF8; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="overlay"><div class="spinner"></div><h2 style="color:#1E4ED8; margin-top:15px; font-weight:800;" id="overlay-text">LOADING...</h2></div>
        
        <div class="logo-container">
            <img src="https://storage.googleapis.com/nh-uat-corp/2024/6/update_N_Health_d5a05fd0a9/update_N_Health_d5a05fd0a9.png" alt="N Health Logo">
        </div>
        <div class="header">
            <h1>ระบบจัดการการสื่อสาร<br><small style="font-size:0.95rem; font-weight:normal; color:#38BDF8; letter-spacing: 2px;">BML/NNG Communiction CENTER</small></h1>
        </div>

        <div class="content">
            <!-- VIEW 1: LOGIN -->
            <div id="view-login" class="view-section active-view" style="text-align: center; padding-top: 15px;">
                <h2 style="color: #0F172A; font-weight: 800; margin-bottom: 25px;">🔐 เข้าสู่ระบบ</h2>
                
                <div class="form-group">
                    <label style="text-align: left;">รหัสพนักงาน:</label>
                    <input type="text" id="empId" placeholder="Emp ID" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label style="text-align: left;">รหัสผ่าน (วันเดือนปีเกิด YYYYMMDD):</label>
                    <input type="password" id="empPwd" placeholder="เช่น 19901231" autocomplete="current-password">
                </div>
                
                <button class="btn-primary" onclick="login()">เข้าสู่ระบบ</button>
            </div>

            <!-- VIEW 2: DASHBOARD MAIN MENU -->
            <div id="view-dashboard" class="view-section">
                <!-- User Profile Bar -->
                <div style="background-color: #FFFFFF; padding: 15px; border-radius: 10px; margin-bottom: 25px; overflow: hidden; border: 2px solid #E2E8F0; display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-weight: 800; color: #1E293B; font-size:1.1rem;" id="user-name">กำลังโหลดข้อมูล...</div>
                    <button class="btn-logout" onclick="logout()">LOGOUT</button>
                </div>

                <h3 style="border-bottom: 2px solid #64748B; color: #64748B; padding-bottom: 8px; margin-top: 10px; font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">สำหรับพนักงาน (User)</h3>
                
                <!-- ลิงก์ไปหน้าต่างๆ (แก้ไขชื่อไฟล์ตามที่คุณต้องการได้เลย) -->
                <a href="https://rb508411.github.io/bml_temp/CheckIn_FromList.html" class="card-menu">📅 ลงนามเข้าสื่อสาร (List)</a>
                <a href="https://rb508411.github.io/bml_temp/ChekIn_Manual.html" class="card-menu">✍️ ลงนามเข้าสื่อสาร (Manual)</a>
                <a href="https://rb508411.github.io/bml_temp/MyCheckIn.html" class="card-menu">📊 ประวัติและชั่วโมงการสื่อสารของฉัน</a>
                
                <div id="admin-menu" style="display: none; margin-top: 30px;">
                    <h3 style="border-bottom: 2px solid #38BDF8; color: #0EA5E9; padding-bottom: 8px; font-size:0.9rem; text-transform:uppercase; letter-spacing:1px;">สำหรับผู้จัด (Admin)</h3>
                    <a href="https://rb508411.github.io/bml_temp/CourseLongName.html" class="card-menu" style="border-color: #38BDF8;">⚙️ จัดการการสื่อสาร & ตรวจสอบผู้เข้าร่วม</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqF92ZskKUgd398CIP0Np1yEYozv4_ew7wJ9IicnEtDCxefZb4zVTGAxo-7WB9zxIT/exec"; 

        function showOverlay(text) { document.getElementById('overlay-text').innerText = text; document.getElementById('overlay').style.display = 'flex'; }
        function hideOverlay() { document.getElementById('overlay').style.display = 'none'; }
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
        }

        // ตรวจสอบสถานะตอนเปิดหน้าเว็บ
        window.onload = function() {
            const savedEmpId = localStorage.getItem('bml_emp_id');
            const savedName = localStorage.getItem('bml_emp_name');
            const savedRole = localStorage.getItem('bml_emp_role');
            
            if(savedEmpId && savedName) {
                // ถ้าเคย Login ไว้แล้ว ให้โชว์หน้าเมนูได้เลย
                document.getElementById('user-name').innerText = `${savedName} (${savedEmpId})`;
                if(savedRole === 'admin') document.getElementById('admin-menu').style.display = 'block';
                switchView('view-dashboard');
            } else {
                switchView('view-login');
            }
        };

        async function login() {
            const empId = document.getElementById('empId').value.trim();
            const password = document.getElementById('empPwd').value.trim();
            
            if (!empId || !password) return alert("กรุณากรอกรหัสพนักงานและรหัสผ่านให้ครบถ้วน");
            
            showOverlay("VERIFYING...");
            try {
                // ส่งทั้ง empId และ password ไปเช็กที่หลังบ้าน
                const res = await fetch(`${SCRIPT_URL}?action=login&empId=${empId}&password=${encodeURIComponent(password)}`);
                const data = await res.json();
                
                if (data.success) {
                    // เก็บบันทึกข้อมูลลงใน Browser เพื่อให้หน้าอื่นๆ (เช่น MyCheckIn.html) ดึงไปใช้ได้
                    localStorage.setItem('bml_emp_id', empId);
                    localStorage.setItem('bml_emp_name', data.name);
                    localStorage.setItem('bml_emp_role', data.role);
                                        
                    document.getElementById('user-name').innerText = `${data.name} (${empId})`;
                    if(data.role === 'admin') document.getElementById('admin-menu').style.display = 'block';
                    else document.getElementById('admin-menu').style.display = 'none';
                    
                    fetch(`${SCRIPT_URL}?action=logActivity&empId=${empId}&activity=Login&details=เข้าสู่ระบบสำเร็จ`).catch(()=>{});
                    
                    // ล้างช่องรหัสผ่านเพื่อความปลอดภัย
                    document.getElementById('empPwd').value = '';
                    switchView('view-dashboard');
                } else { 
                    alert(data.message); // เช่น รหัสผ่านผิด
                }
            } catch (err) { alert("เชื่อมต่อเซิร์ฟเวอร์ล้มเหลว กรุณาลองใหม่"); }
            hideOverlay();
        }

        function logout() {
            const empId = localStorage.getItem('bml_emp_id');
            if(empId) {
                fetch(`${SCRIPT_URL}?action=logActivity&empId=${empId}&activity=Logout&details=ออกจากระบบ`).catch(()=>{});
            }
            // ล้างข้อมูลในระบบ
            localStorage.clear();
            document.getElementById('empId').value = '';
            document.getElementById('empPwd').value = '';
            document.getElementById('admin-menu').style.display = 'none';
            switchView('view-login');
        }
    </script>
</body>
</html>
