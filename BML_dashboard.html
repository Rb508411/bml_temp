<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SmartLab SmartTemp v.2</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #eaf2f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; background-color: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { text-align: center; color: #f0f4f8; margin-top: 0; margin-bottom: 0}
        
        .controls, .export-controls { display: flex; gap: 15px; flex-wrap: wrap; background-color: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px; align-items: center; }
        select, input[type="email"] { padding: 10px; border-radius: 5px; border: 1px solid #bdc3c7; font-size: 1rem; flex: 1; min-width: 150px; }
        .btn-export { background-color: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-export:hover { background-color: #219150; }
 
        .btn-summary { background-color: #e67e22; } .btn-summary:hover { background-color: #d35400; }
        .btn-map { background-color: #16a085; } .btn-map:hover { background-color: #117a65; }

        .chart-container { position: relative; height: 65vh; width: 100%; margin-bottom: 20px; }
        #loading { text-align: center; color: #e67e22; font-weight: bold; font-size: 1.2rem; display: none; margin: 20px 0; }
        
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9rem; text-align: center; }
        .data-table th { background-color: #00338D; color: white; padding: 10px; border: 1px solid #bdc3c7; }
        .data-table td { padding: 8px; border: 1px solid #bdc3c7; }
        .data-table tr:nth-child(even) { background-color: #f9f9f9; }

        .controls { display: flex; gap: 15px; flex-wrap: wrap; background-color: #eaf2f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; align-items: center; justify-content: center;}
        .controls label { font-weight: bold; color: #2980b9; }

        /* ป้องกันการตัดหน้ากระดาษขาดครึ่งบรรทัด และให้พยายามดึงหัวตารางซ้ำ */
        .data-table thead { display: table-header-group; }
        .data-table tr { page-break-inside: avoid; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; padding-top: 10px; margin-bottom: 15px;">
        <img src="https://storage.googleapis.com/nh-uat-corp/2024/6/update_N_Health_d5a05fd0a9/update_N_Health_d5a05fd0a9.png" alt="N Health Logo" style="max-height: 70px; width: auto; object-fit: contain;">
    </div>

    <style>
        .header { background: linear-gradient(135deg, #00338D, #34495e); color: white; padding: 10px; text-align: center; }
        .menu-link-btn { color: white !important; padding: 10px 15px; border-radius: 6px; text-decoration: none; font-size: 0.95rem; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: all 0.3s ease; }
        .menu-btn-map { background-color: #00338D; } .menu-btn-map:hover { background-color: #001f5c; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .menu-btn-main { background-color: #2c3e50; } .menu-btn-main:hover { background-color: #939393; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .menu-btn-dash { background-color: #3498db; } .menu-btn-dash:hover { background-color: #2980b9; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .menu-btn-sum { background-color: #e67e22; } .menu-btn-sum:hover { background-color: #d35400; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .menu-btn-frost { background-color: #3a2dec; } .menu-btn-frost:hover { background-color: #595beb; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    </style>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background-color: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 4px solid #00338D; flex-wrap: wrap; gap: 10px;">
        <h3 style="margin-top:0; margin-bottom:0; color: #2c3e50;">เลือกหน้าต่าง</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="https://rb508411.github.io/bml_temp/BML_map.html" target="_blank" class="menu-link-btn menu-btn-map">🗺️ ผังห้อง</a>
            <a href="https://rb508411.github.io/bml_temp/TempBML.html" target="_blank" class="menu-link-btn menu-btn-main">🏠 หน้าหลัก</a>
            <a href="https://rb508411.github.io/bml_temp/Summarize_BML.html" target="_blank" class="menu-link-btn menu-btn-sum">📝 รายงานสรุป</a>
            <a href="https://rb508411.github.io/bml_temp/BML_defrost.html" target="_blank" class="menu-link-btn menu-btn-frost">❄️ กิจกรรมตู้เย็น</a>
        </div>
    </div>

    <div id="user-profile" style="text-align: center; background-color: #eaf2f8; padding: 8px; border-radius: 6px; color: #2c3e50; font-size: 0.95rem; margin-bottom: 20px; display: none;">
        👤 เข้าสู่ระบบโดย: <strong id="display-name" style="color: #2980b9;"></strong>
    </div>

    <div class="header">
        <h1>📊 Dashboard อุณหภูมิและความชื้น<br><small style="font-weight:normal; font-size:1rem;">Molecular Laboratory</small></h1>
    </div>
    
    <div class="controls">
        <div style="display: flex; gap: 10px; align-items: center; width: 100%; margin-bottom: 10px; flex-wrap: wrap;">
            <label style="font-weight: bold; color: #2c3e50;">📅 ข้อมูลตั้งแต่:</label>
            <input type="date" id="startDate" onchange="renderChart()" style="padding: 8px; border-radius: 5px; border: 1px solid #bdc3c7;">
            <label style="font-weight: bold; color: #2c3e50;">ถึง:</label>
            <input type="date" id="endDate" onchange="renderChart()" style="padding: 8px; border-radius: 5px; border: 1px solid #bdc3c7;">
            <span style="font-size: 0.85rem; color: #EA2839;">*ดึงย้อนหลังได้สูงสุด 3 เดือน</span>
        </div>
        
        <select id="viewType" onchange="updateSubFilter()">
            <option value="room_temp">🌡️ ดูอุณหภูมิห้อง (รายห้อง)</option>
            <option value="room_hum">💧 ดูความชื้นห้อง (รายห้อง)</option>
            <option value="equip">🔬 ดูอุณหภูมิเครื่องมือ (รายรุ่น)</option>
            <option value="group" style="font-weight:bold; color:#d35400;">📁 ดูแบบกลุ่ม (เปรียบเทียบหลายเครื่อง)</option>
        </select>
        
        <select id="subFilter" onchange="renderChart()">
            <option value="">-- กรุณารอโหลดข้อมูล --</option>
        </select>
    </div>

    <div class="export-controls">
        <h4 style="margin:0; color:#34495e;">📤 ส่งออก:</h4>
        <select id="export-format">
            <option value="pdf">PDF (Chart and Raw data)</option>
            <option value="excel">Excel (Raw data)</option>
        </select>
        <select id="export-method" onchange="toggleEmail()">
            <option value="download">📥 บันทึกลงเครื่อง</option>
            <option value="email">📧 ส่งผ่านอีเมล</option>
        </select>
        <input type="email" id="export-email" placeholder="ระบุอีเมลผู้รับ..." style="display:none;">
        <button class="btn-export" onclick="handleExport()">ส่งออกข้อมูล</button>
    </div>

    <div id="loading">⏳ กำลังประมวลผล...</div>
    
    <div id="export-content" style="padding: 10px; background: white;">
        <h3 id="report-title" style="text-align: center; display: none; color: #2c3e50; margin-bottom: 20px;">รายงานข้อมูล</h3>

        <div id="ai-prediction-container" style="display: none; background-color: #fdf2e9; border-left: 5px solid #e67e22; padding: 15px; margin-bottom: 15px; border-radius: 8px;">
            <h4 style="margin-top: 0; color: #d35400; margin-bottom: 10px;">🤖 AI Predictive Alert (ระบบคาดการณ์แนวโน้มความผิดปกติ)</h4>
            <ul id="ai-prediction-list" style="margin: 0; padding-left: 20px; font-size: 0.95rem; color: #34495e;"></ul>
        </div>

        <div class="chart-container" style="position: relative;">
            <button onclick="resetZoom()" id="btn-reset-zoom" style="position: absolute; top: 10px; right: 10px; z-index: 10; padding: 6px 12px; background-color: #34495e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: none;">
                🔍 คืนค่ามุมมอง (Reset Zoom)
            </button>
            <canvas id="myChart"></canvas>
        </div>
        <div id="data-table-container" style="overflow-x: auto;"></div>
    </div>
</div>

<script>
    // *** ให้นำ URL ของ Google Apps Script มาใส่ตรงนี้ ***
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWYzohslXOIFKacZ_4UcFQrJ5WL_FE8FWuresqT3_TkpciFBrGXM_wIY1a2l5A5TE/exec";

    function checkLoginExpiration() {
        const savedUser = localStorage.getItem('lab_logged_in_user');
        const savedTime = localStorage.getItem('lab_login_timestamp');
        
        if (savedUser && savedTime) {
            const now = Date.now();
            const ONE_HOUR = 60 * 60 * 1000; // 1 ชั่วโมง
            
            if (now - parseInt(savedTime) > ONE_HOUR) {
                localStorage.removeItem('lab_logged_in_user');
                localStorage.removeItem('lab_login_timestamp');
                
                alert("⏱️ เซสชันหมดอายุ (เกิน 1 ชั่วโมง) ระบบจะพากลับไปหน้าเข้าสู่ระบบครับ");
                window.location.href = "https://rb508411.github.io/bml_temp/TempBML.html"; 
                return false;
            }
            return true;
        }
        
        alert("🔒 คุณยังไม่ได้เข้าสู่ระบบ กรุณาเข้าสู่ระบบผ่านหน้าหลักก่อนครับ");
        window.location.href = "https://rb508411.github.io/bml_temp/TempBML.html";
        return false;
    }






    let currentUser = localStorage.getItem('lab_logged_in_user') || "ไม่ระบุตัวตน";
    
    let rawData = [];
    let rooms = new Set();
    let equipments = new Set();
    let myChart = null;

    let currentLabels = [];
    let activeDatasets = [];
    
    const colorPalette = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#34495e', '#ff6b81', '#7bed9f'];

    async function loadData() {
        const today = new Date();
        const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(today.getDate() - 30);
        const threeMonthsAgo = new Date(); threeMonthsAgo.setMonth(today.getMonth() - 3);

        const formatDate = (date) => {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        };

        const startDateEl = document.getElementById('startDate');
        const endDateEl = document.getElementById('endDate');
        
        startDateEl.value = formatDate(thirtyDaysAgo);
        endDateEl.value = formatDate(today);
        startDateEl.min = formatDate(threeMonthsAgo);
        startDateEl.max = formatDate(today);
        endDateEl.max = formatDate(today);

        showLoading("กำลังดึงข้อมูลจากฐานข้อมูล...");
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getDashboardData`);
            rawData = await res.json();
            processFilters();
        } catch (e) {
            alert("ดึงข้อมูลไม่สำเร็จ กรุณาลองใหม่ครับ");
        }
        hideLoading();
    }

    function processFilters() {
        rooms.clear();
        equipments.clear();
        
        rawData.forEach(row => {
            if (row.room) rooms.add(row.room);
            if (row.equipments && row.equipments !== '-' && row.equipments.trim() !== '') {
                if (row.equipments.includes('=')) {
                    let items = row.equipments.split(',');
                    items.forEach(item => {
                        let parts = item.split('=');
                        if (parts.length === 2) equipments.add(parts[0].trim());
                    });
                } else {
                    equipments.add(row.equipments.trim());
                }
            }
        });
        updateSubFilter();
    }

    function updateSubFilter() {
        const viewType = document.getElementById('viewType').value;
        const subFilter = document.getElementById('subFilter');
        subFilter.innerHTML = '';

        let options = [];
        if (viewType === 'room_temp' || viewType === 'room_hum') {
            options = Array.from(rooms).sort();
        } else if (viewType === 'equip') {
            options = Array.from(equipments).sort();
        } else if (viewType === 'group') {
            options = ["อุณหภูมิห้องทั้งหมด", "ความชื้นห้องทั้งหมด", "ตู้เย็น (2-8 °C)", "ตู้เย็น -20 °C", "ตู้เย็น -30 °C", "ตู้เย็น -70 °C"];
        }

        options.forEach(opt => {
            const el = document.createElement('option');
            el.value = opt;
            el.innerText = opt;
            subFilter.appendChild(el);
        });

        if (options.length > 0) renderChart();
    }

    function renderChart() {
        const viewType = document.getElementById('viewType').value;
        const selectedTarget = document.getElementById('subFilter').value;
        if (!selectedTarget) return;

        const sVal = document.getElementById('startDate').value;
        const eVal = document.getElementById('endDate').value;
        if (!sVal || !eVal) return;

        const sParts = sVal.split('-');
        const sDate = new Date(sParts[0], sParts[1] - 1, sParts[2], 0, 0, 0, 0);
        const eParts = eVal.split('-');
        const eDate = new Date(eParts[0], eParts[1] - 1, eParts[2], 23, 59, 59, 999);

        const parseTimestamp = (ts) => {
            if (!ts) return null;
            let d = new Date(ts);
            if (!isNaN(d.getTime())) return d;
            if (typeof ts === 'string' && ts.includes('/')) {
                let parts = ts.split(/[\s/:]+/);
                if (parts.length >= 3) {
                    return new Date(parts[2], parts[1] - 1, parts[0], parts[3] || 0, parts[4] || 0, parts[5] || 0);
                }
            }
            return null;
        };

        let filteredData = rawData.filter(row => {
            let d = parseTimestamp(row.timestamp);
            if (!d) return false;
            return d.getTime() >= sDate.getTime() && d.getTime() <= eDate.getTime();
        });

        currentLabels = [];
        activeDatasets = [];
        
        let tempTimestamps = new Set();
        let groupedData = {}; 

        const getSessionKey = (timestamp) => {
            let d = parseTimestamp(timestamp);
            if (!d) return "Unknown";
            let yyyy = d.getFullYear();
            let mm = String(d.getMonth() + 1).padStart(2, '0');
            let dd = String(d.getDate()).padStart(2, '0');
            let hour = d.getHours();
            let session = (hour < 12) ? "6AM-12" : "3PM-11PM";
            return `${yyyy}-${mm}-${dd} (${session})`;
        };

        let globalLimits = null;
        let fixedYMin = null; // 📍 ตัวแปรใหม่สำหรับล็อกแกน Y ต่ำสุด
        let fixedYMax = null; // 📍 ตัวแปรใหม่สำหรับล็อกแกน Y สูงสุด
        let lowerTarget = selectedTarget.toLowerCase();
        
        if (viewType === 'room_temp' || selectedTarget === "อุณหภูมิห้องทั้งหมด") {
            globalLimits = { min: 18, max: 25 };
            fixedYMin = 10; fixedYMax = 35;
        }
        else if (viewType === 'room_hum' || selectedTarget === "ความชื้นห้องทั้งหมด") {
            globalLimits = { min: 20, max: 60 };
            fixedYMin = 10; fixedYMax = 80;
        }
        else if (lowerTarget.includes("-70")) {
            globalLimits = { min: -75, max: -65 };
            fixedYMin = -85; fixedYMax = -25; // 📍 ล็อกแกน Y สำหรับตู้ -70
        }
        else if (lowerTarget.includes("-30")) {
            globalLimits = { min: -40, max: -20 };
            fixedYMin = -40; fixedYMax = 20;  // 📍 ล็อกแกน Y สำหรับตู้ -30
        }
        else if (lowerTarget.includes("-20")) {
            globalLimits = { min: -35, max: -15 };
            fixedYMin = -40; fixedYMax = 0;   // 📍 ล็อกแกน Y สำหรับตู้ -20
        }
        else if (lowerTarget.includes("ตู้เย็น")) {
            globalLimits = { min: 2, max: 8 };
            fixedYMin = -5; fixedYMax = 25;    // 📍 ล็อกแกน Y สำหรับตู้เย็นปกติ (2-8)
        }

        if (viewType === 'room_temp') {
            filteredData.forEach(row => {
                if (row.room === selectedTarget) {
                    let tsKey = getSessionKey(row.timestamp);
                    tempTimestamps.add(tsKey);
                    if (!groupedData['อุณหภูมิห้อง (°C)']) groupedData['อุณหภูมิห้อง (°C)'] = {};
                    groupedData['อุณหภูมิห้อง (°C)'][tsKey] = row.rTemp;
                }
            });
        } 
        else if (viewType === 'room_hum') {
            filteredData.forEach(row => {
                if (row.room === selectedTarget) {
                    let tsKey = getSessionKey(row.timestamp);
                    tempTimestamps.add(tsKey);
                    if (!groupedData['ความชื้น (%)']) groupedData['ความชื้น (%)'] = {};
                    groupedData['ความชื้น (%)'][tsKey] = row.rHum;
                }
            });
        }
        else if (viewType === 'equip') {
            filteredData.forEach(row => {
                if (row.equipments && row.equipments !== '-') {
                    let tsKey = getSessionKey(row.timestamp);
                    if (row.equipments.includes('=')) {
                        let items = row.equipments.split(',');
                        items.forEach(item => {
                            let parts = item.split('=');
                            if (parts.length === 2 && parts[0].trim() === selectedTarget) {
                                let val = parseFloat(parts[1].replace('°C', '').trim());
                                if (!isNaN(val)) {
                                    tempTimestamps.add(tsKey);
                                    let colName = `อุณหภูมิ ${selectedTarget} (°C)`;
                                    if (!groupedData[colName]) groupedData[colName] = {};
                                    groupedData[colName][tsKey] = val;
                                }
                            }
                        });
                    } else if (row.equipments.trim() === selectedTarget) {
                        let rawVal = row.equipTemp || row['Equipments Temp'] || row.equipmentsTemp;
                        let val = parseFloat(rawVal);
                        if (!isNaN(val)) {
                            tempTimestamps.add(tsKey);
                            let colName = `อุณหภูมิ ${selectedTarget} (°C)`;
                            if (!groupedData[colName]) groupedData[colName] = {};
                            groupedData[colName][tsKey] = val;
                        }
                    }
                }
            });
        } 
        else if (viewType === 'group') {
            filteredData.forEach(row => {
                let tsKey = getSessionKey(row.timestamp);
                if (selectedTarget === "อุณหภูมิห้องทั้งหมด") {
                    tempTimestamps.add(tsKey);
                    if (!groupedData[row.room]) groupedData[row.room] = {};
                    groupedData[row.room][tsKey] = row.rTemp;
                } 
                else if (selectedTarget === "ความชื้นห้องทั้งหมด") {
                    tempTimestamps.add(tsKey);
                    if (!groupedData[row.room]) groupedData[row.room] = {};
                    groupedData[row.room][tsKey] = row.rHum;
                } 
                else {
                    if (row.equipments && row.equipments !== '-') {
                        let processGroupEquip = (eqName, eqValStr) => {
                            let val = parseFloat(String(eqValStr).replace('°C', '').trim());
                            let isMatch = false;

                            if (selectedTarget === "ตู้เย็น -20 °C" && eqName.includes("-20")) isMatch = true;
                            else if (selectedTarget === "ตู้เย็น -30 °C" && eqName.includes("-30")) isMatch = true;
                            else if (selectedTarget === "ตู้เย็น -70 °C" && eqName.includes("-70")) isMatch = true;
                            else if (selectedTarget === "ตู้เย็น (2-8 °C)" && eqName.includes("ตู้เย็น") && !eqName.includes("-")) isMatch = true;

                            if (isMatch && !isNaN(val)) {
                                tempTimestamps.add(tsKey);
                                let colName = `${row.room}: ${eqName}`;
                                if (!groupedData[colName]) groupedData[colName] = {};
                                groupedData[colName][tsKey] = val;
                            }
                        };

                        if (row.equipments.includes('=')) {
                            let items = row.equipments.split(',');
                            items.forEach(item => {
                                let parts = item.split('=');
                                if (parts.length === 2) processGroupEquip(parts[0].trim(), parts[1]);
                            });
                        } else {
                            let rawVal = row.equipTemp || row['Equipments Temp'] || row.equipmentsTemp;
                            if (rawVal !== undefined && rawVal !== '') {
                                processGroupEquip(row.equipments.trim(), rawVal);
                            }
                        }
                    }
                }
            });
        }

        currentLabels = Array.from(tempTimestamps).sort((a, b) => {
            let dateA = a.split(' ')[0].split('-');
            let dateB = b.split(' ')[0].split('-');
            let timeA = new Date(dateA[0], dateA[1] - 1, dateA[2]).getTime();
            let timeB = new Date(dateB[0], dateB[1] - 1, dateB[2]).getTime();
            
            if (timeA !== timeB) return timeA - timeB;
            
            let sessionA = a.includes("6AM-12") ? 0 : 1;
            let sessionB = b.includes("6AM-12") ? 0 : 1;
            return sessionA - sessionB;
        });

        let colorIdx = 0;
        for (let label in groupedData) {
            let dataArray = currentLabels.map(ts => groupedData[label][ts] !== undefined ? groupedData[label][ts] : null);
            let c = colorPalette[colorIdx % colorPalette.length];
            
            activeDatasets.push({
                label: label,
                data: dataArray,
                borderColor: c,
                backgroundColor: c + '20',
                borderWidth: 2,
                tension: 0.3,
                spanGaps: true,
                isLimitLine: false,
                limitRange: globalLimits
            });
            colorIdx++;
        }

        if (viewType !== 'group'){
            let maDatasets = [];
            activeDatasets.forEach(ds => {
                if (!ds.isLimitLine) { 
                    let maDataArray = [];
                    for (let i = 0; i < currentLabels.length; i++) {
                        if (ds.data[i] === null) {
                            maDataArray.push(null);
                            continue;
                        }
                        
                        let curParts = currentLabels[i].split(' ')[0].split('-');
                        let currentTime = new Date(curParts[0], curParts[1] - 1, curParts[2]).getTime();
                        let sum = 0;
                        let count = 0;
                        
                        for (let j = i; j >= 0; j--) {
                            let pastParts = currentLabels[j].split(' ')[0].split('-');
                            let pastTime = new Date(pastParts[0], pastParts[1] - 1, pastParts[2]).getTime();
                            
                            if (currentTime - pastTime <= 7 * 24 * 60 * 60 * 1000) {
                                if (ds.data[j] !== null) {
                                    sum += ds.data[j];
                                    count++;
                                }
                            } else {
                                break; 
                            }
                        }
                        
                        if (count > 0) {
                            maDataArray.push(parseFloat((sum / count).toFixed(2)));
                        } else {
                            maDataArray.push(null);
                        }
                    }

                    maDatasets.push({
                        label: `ค่าเฉลี่ย 7 วัน (${ds.label})`,
                        data: maDataArray,
                        borderColor: '#bdc3c7', 
                        borderWidth: 2,
                        borderDash: [3, 3], 
                        pointRadius: 0, 
                        fill: false,
                        tension: 0.3,
                        spanGaps: true,
                        isLimitLine: true 
                    });
                }
            });
            
            activeDatasets.push(...maDatasets);
        }

        let limitsToAdd = [];
        if (globalLimits) {
            limitsToAdd.push({ label: `Upper Limit (${globalLimits.max})`, val: globalLimits.max, color: '#000000' });
            limitsToAdd.push({ label: `Lower Limit (${globalLimits.min})`, val: globalLimits.min, color: '#000000' });
        }

        limitsToAdd.forEach(limit => {
            let limitDataArray = currentLabels.map(() => limit.val);
            activeDatasets.push({
                label: limit.label,
                data: limitDataArray,
                borderColor: limit.color,
                borderWidth: 2,
                borderDash: [5, 5],
                pointRadius: 0,     
                fill: false,
                isLimitLine: true   
            });
        });

const aiContainer = document.getElementById('ai-prediction-container');
        const aiList = document.getElementById('ai-prediction-list');
        aiList.innerHTML = '';
        let hasWarnings = false;

        activeDatasets.forEach(ds => {
            if (!ds.isLimitLine && ds.limitRange) {
                let warning = analyzeTrend(ds.data, ds.limitRange, ds.label);
                if (warning) {
                    let li = document.createElement('li');
                    li.innerHTML = warning;
                    aiList.appendChild(li);
                    hasWarnings = true;
                }
            }
        });

        if (hasWarnings) {
            aiContainer.style.display = 'block';
        } else {
            aiContainer.style.display = 'none';
        }

        drawChart(fixedYMin, fixedYMax);
        renderDataTable();
        
        const reportTargetText = document.getElementById('report-title');
        if (reportTargetText) reportTargetText.innerText = `รายงานผล: ${selectedTarget}`;
    }

    // ==========================================
    // ML Algorithm: Simple Linear Regression
    // ==========================================
    function analyzeTrend(dataArray, limitRange, label) {
        if (!limitRange || !dataArray) return null;
        
        let validPoints = [];
        for(let i=0; i<dataArray.length; i++) {
            if(dataArray[i] !== null) validPoints.push(dataArray[i]);
        }
        
        if (validPoints.length < 5) return null; 
        
        let recentData = validPoints.slice(-10); 
        let n = recentData.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        
        recentData.forEach((y, x) => {
            sumX += x;
            sumY += y;
            sumXY += x * y;
            sumXX += x * x;
        });
        
        let slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
        let intercept = (sumY - slope * sumX) / n;
        
        let nextX = n + 2; 
        let predictedY = (slope * nextX) + intercept;
        
        const significantSlope = 0.05;

        if (slope > significantSlope && predictedY >= limitRange.max) {
            return `📈 <b>${label}:</b> อุณหภูมิมีแนวโน้ม <span style="color:#e74c3c; font-weight:bold;">สูงขึ้นต่อเนื่อง</span> (พยากรณ์: ${predictedY.toFixed(2)}) อาจทะลุเกณฑ์ขีดจำกัดบน (${limitRange.max}) เร็วๆ นี้`;
        }
        if (slope < -significantSlope && predictedY <= limitRange.min) {
            return `📉 <b>${label}:</b> อุณหภูมิมีแนวโน้ม <span style="color:#3498db; font-weight:bold;">ลดลงต่อเนื่อง</span> (พยากรณ์: ${predictedY.toFixed(2)}) อาจทะลุเกณฑ์ขีดจำกัดล่าง (${limitRange.min}) เร็วๆ นี้`;
        }
        return null;
    }

    function drawChart(yMin = null, yMax = null) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if (myChart) myChart.destroy();

        // 📍 สร้างโครงสร้าง Option ของกราฟ
        let chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            scales: { 
                x: { ticks: { maxRotation: 45, minRotation: 45 } },
                y: {} // เตรียมพื้นที่สำหรับแกน Y
            },
            animation: false,
            plugins: {
                zoom: {
                    pan: { enabled: true, mode: 'x' },
                    zoom: {
                        wheel: { enabled: true },
                        pinch: { enabled: true },
                        mode: 'x',
                        onZoomComplete: function() {
                            document.getElementById('btn-reset-zoom').style.display = 'block';
                        }
                    }
                }
            }
        };

        // 📍 ถ้ามีการส่งค่าล็อกแกนมา (เป็นของตู้เย็น) ให้ยัดค่าใส่แกน Y บังคับสเกลทันที
        if (yMin !== null) chartOptions.scales.y.min = yMin;
        if (yMax !== null) chartOptions.scales.y.max = yMax;

        // สั่งวาดกราฟ
        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: currentLabels, datasets: activeDatasets },
            options: chartOptions
        });
        
        const btnReset = document.getElementById('btn-reset-zoom');
        if(btnReset) btnReset.style.display = 'none';
    }

    function resetZoom() {
        if (myChart) {
            myChart.resetZoom();
            document.getElementById('btn-reset-zoom').style.display = 'none';
        }
    }

    // 📍 คืนค่าตารางแบบปกติ (ไม่ซอย) แต่ใช้ thead หุ้มหัวตารางไว้
    function renderDataTable() {
        let dataDatasets = activeDatasets.filter(ds => !ds.isLimitLine);
        
        let tableHTML = '<table class="data-table"><thead><tr><th>เวลา (Timestamp)</th>';
        dataDatasets.forEach(ds => { tableHTML += `<th>${ds.label}</th>`; });
        tableHTML += '</tr></thead><tbody>';

        for (let i = 0; i < currentLabels.length; i++) {
            tableHTML += `<tr><td>${currentLabels[i]}</td>`;
            dataDatasets.forEach(ds => {
                let val = ds.data[i] !== null ? ds.data[i] : '-';
                let styleStr = '';

                if (val !== '-' && ds.limitRange) {
                    if (val < ds.limitRange.min) {
                        styleStr = 'color: rgb(0,0,255); font-weight: bold;';
                    }
                    else if (val > ds.limitRange.max) {
                        styleStr = 'color: rgb(255,0,0); font-weight: bold;';
                    }
                }
                tableHTML += `<td style="${styleStr}">${val}</td>`;
            });
            tableHTML += '</tr>';
        }
        tableHTML += '</tbody></table>';
        document.getElementById('data-table-container').innerHTML = tableHTML;
    }

    function toggleEmail() {
        const method = document.getElementById('export-method').value;
        const emailInput = document.getElementById('export-email');
        emailInput.style.display = method === 'email' ? 'block' : 'none';
    }

    async function handleExport() {
        const format = document.getElementById('export-format').value;
        const method = document.getElementById('export-method').value;
        const email = document.getElementById('export-email').value;
        const target = document.getElementById('subFilter').value;

        if (method === 'email' && !email) {
            alert("กรุณาระบุอีเมลปลายทางที่ต้องการให้ระบบส่งไฟล์ไปครับ");
            return;
        }

        showLoading("กำลังสร้างไฟล์และบันทึกประวัติ...");
        try {
            if (format === 'pdf') {
                document.getElementById('report-title').style.display = 'block';
                
                const tableContainer = document.getElementById('data-table-container');
                const exportElement = document.getElementById('export-content');
                
                // 1. ปลดล็อกข้อจำกัด CSS ชั่วคราวเพื่อให้ตารางกางออกตามข้อมูลจริง
                tableContainer.style.overflowX = 'visible';
                exportElement.style.height = 'auto';
                exportElement.style.width = 'auto'; 
                exportElement.style.maxWidth = 'none';
                
                // 📍 2. ระบบคำนวณขนาดกระดาษอัตโนมัติ (A4 -> A3 -> A2)
                const actualWidth = exportElement.scrollWidth;
                
                let paperFormat = 'a4';
                let pdfWidthInches = 11.69;  // A4 แนวนอน
                let pdfHeightInches = 8.27; 
                let captureWidth = 1200;    
                
                // เช็คขนาดจากใหญ่สุดลงมาเล็กสุด
                if (actualWidth > 2400) {
                    paperFormat = 'a1';
                    pdfWidthInches = 33.11;  // A1 กว้าง 23.39 นิ้ว
                    pdfHeightInches = 23.39; // A1 สูง 16.54 นิ้ว
                    captureWidth = Math.max(3394, actualWidth + 50); 
                } 

                else if (actualWidth > 1700) {
                    paperFormat = 'a2';
                    pdfWidthInches = 23.39;  // A2 กว้าง 23.39 นิ้ว
                    pdfHeightInches = 16.54; // A2 สูง 16.54 นิ้ว
                    captureWidth = Math.max(2400, actualWidth + 50); 
                } 
                else if (actualWidth > 1200) {
                    paperFormat = 'a3';
                    pdfWidthInches = 16.54;  // A3 กว้าง 16.54 นิ้ว
                    pdfHeightInches = 11.69; // A3 สูง 11.69 นิ้ว
                    captureWidth = Math.max(1700, actualWidth + 50); 
                }
                
                // ล็อกความกว้างตามที่ระบบคำนวณได้
                exportElement.style.width = captureWidth + 'px';
                exportElement.style.margin = '0 auto';

                // 3. สร้างภาพ Header แบบยืดหยุ่นตามความกว้างกระดาษ
                const canvasWidth = Math.floor(pdfWidthInches * 200); // ความละเอียด 200 DPI
                const hdrCanvas = document.createElement('canvas');
                hdrCanvas.width = canvasWidth;
                hdrCanvas.height = 200;
                const ctxH = hdrCanvas.getContext('2d');
                ctxH.fillStyle = "white";
                ctxH.fillRect(0, 0, hdrCanvas.width, hdrCanvas.height);
                
                if (window.pdfLogoBase64) {
                    const img = new Image();
                    img.src = window.pdfLogoBase64;
                    ctxH.drawImage(img, 100, 40, 280, 85);
                }
                
                ctxH.font = "bold 60px 'Helvetica Neue', Arial, sans-serif";
                ctxH.fillStyle = "#2c3e50";
                ctxH.textAlign = "center";
                ctxH.fillText("แบบบันทึกอุณหภูมิและความชื้น", hdrCanvas.width / 2, 110); 
                
                ctxH.beginPath();
                ctxH.moveTo(100, 180);
                ctxH.lineTo(hdrCanvas.width - 100, 180); // ลากเส้นถึงขอบขวากระดาษเสมอ
                ctxH.strokeStyle = "#2c3e50";
                ctxH.lineWidth = 4;
                ctxH.stroke();
                const headerData = hdrCanvas.toDataURL('image/jpeg', 1.0);

                // 4. สร้างภาพ Footer แบบยืดหยุ่น
                const ftrCanvas = document.createElement('canvas');
                ftrCanvas.width = canvasWidth;
                ftrCanvas.height = 100;
                const ctxF = ftrCanvas.getContext('2d');
                ctxF.fillStyle = "white";
                ctxF.fillRect(0, 0, ftrCanvas.width, ftrCanvas.height);
                
                ctxF.beginPath();
                ctxF.moveTo(100, 10);
                ctxF.lineTo(ftrCanvas.width - 100, 10);
                ctxF.strokeStyle = "#bdc3c7";
                ctxF.lineWidth = 2;
                ctxF.stroke();
                
                ctxF.font = "35px 'Helvetica Neue', Arial, sans-serif";
                ctxF.fillStyle = "#34495e";
                ctxF.textAlign = "left";
                ctxF.fillText("FP-BML-BIO-00-008/4 แก้ไขครั้งที่ 09", 100, 60);
                const footerData = ftrCanvas.toDataURL('image/jpeg', 1.0);

                // 5. ตั้งค่ากระดาษโดยนำค่าที่คำนวณมาใช้งาน
                const opt = {
                    margin: [1.1, 0.5, 0.8, 0.5], 
                    filename: `Report_${target}.pdf`,
                    image: { type: 'jpeg', quality: 1 },
                    html2canvas: { scale: 2, useCORS: true, scrollY: 0, windowWidth: captureWidth },
                    jsPDF: { unit: 'in', format: paperFormat, orientation: 'landscape' },
                    pagebreak: { mode: ['css', 'legacy'], avoid: 'tr' } 
                };

                // 6. สั่งสร้าง PDF แล้วประทับตราตามขนาดกระดาษจริง
                let worker = html2pdf().set(opt).from(exportElement).toPdf().get('pdf').then(function(pdf) {
                    const totalPages = pdf.internal.getNumberOfPages();
                    const footerY = pdfHeightInches - 0.67; // คำนวณพิกัดแกน Y สำหรับ Footer ให้พอดีความสูงกระดาษ
                    for (let i = 1; i <= totalPages; i++) {
                        pdf.setPage(i);
                        pdf.addImage(headerData, 'JPEG', 0, 0, pdfWidthInches, 1.0);   
                        pdf.addImage(footerData, 'JPEG', 0, footerY, pdfWidthInches, 0.5); 
                    }
                });

                if (method === 'download') {
                    await worker.save();
                    await sendLogToBackend(target, format, method, "");
                } else {
                    const pdfBase64 = await worker.outputPdf('datauristring');
                    const b64Data = pdfBase64.split(',')[1];
                    await sendLogToBackend(target, format, method, email, b64Data, "application/pdf", `Report_${target}.pdf`);
                }
                
                // 7. คืนค่าหน้าจอให้กลับสู่ปกติ
                document.getElementById('report-title').style.display = 'none';
                tableContainer.style.overflowX = 'auto';
                exportElement.style.width = 'auto'; 
                exportElement.style.maxWidth = '100%';

            } else if (format === 'excel') {
                let dataDatasets = activeDatasets.filter(ds => !ds.isLimitLine);

                let ws_data = [];
                let headers = ["เวลา (Timestamp)"];
                dataDatasets.forEach(ds => headers.push(ds.label));
                ws_data.push(headers);
                
                for(let i=0; i<currentLabels.length; i++) {
                    let row = [currentLabels[i]];
                    dataDatasets.forEach(ds => row.push(ds.data[i] !== null ? ds.data[i] : ''));
                    ws_data.push(row);
                }

                var ws = XLSX.utils.aoa_to_sheet(ws_data);
                var wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Data");

                if (method === 'download') {
                    XLSX.writeFile(wb, `Report_${target}.xlsx`);
                    await sendLogToBackend(target, format, method, "");
                } else {
                    const excelBase64 = XLSX.write(wb, {type: 'base64', bookType: 'xlsx'});
                    await sendLogToBackend(target, format, method, email, excelBase64, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", `Report_${target}.xlsx`);
                }
            }
            alert("✅ ดำเนินการส่งออกข้อมูลเรียบร้อยแล้วครับ");
        } catch(e) {
            alert("เกิดข้อผิดพลาดในการส่งออก: " + e.message);
        }
        hideLoading();
    }

    async function sendLogToBackend(target, format, method, email, fileBase64 = null, mimeType = null, fileName = null) {
        const payload = {
            action: "exportLog",
            user: currentUser,
            target: target,
            format: format,
            method: method,
            email: email,
            fileBase64: fileBase64,
            mimeType: mimeType,
            fileName: fileName
        };

        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
    }

    function showLoading(text) {
        const loader = document.getElementById('loading');
        loader.innerText = text;
        loader.style.display = 'block';
    }
    
    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    // ==========================================
    // เตรียมโหลดรูปโลโก้เข้า Cache เพื่อให้ประทับตรา PDF ได้
    // ==========================================
    window.pdfLogoBase64 = "";
    
    function preloadPDFLogo() {
        const logoUrl = 'https://storage.googleapis.com/nh-uat-corp/2024/6/update_N_Health_d5a05fd0a9/update_N_Health_d5a05fd0a9.png';
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        
        img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            window.pdfLogoBase64 = canvas.toDataURL('image/png'); 
        };
        img.src = logoUrl;
    }

    window.onload = () => {
        loadData();
        preloadPDFLogo();
    };

    window.addEventListener('load', () => {
        if (checkLoginExpiration()) {
            const savedUser = localStorage.getItem('lab_logged_in_user');
            
            const displayNameEl = document.getElementById('display-name');
            const userProfileEl = document.getElementById('user-profile');
            
            if (displayNameEl && userProfileEl) {
                displayNameEl.innerText = savedUser;
                userProfileEl.style.display = 'block'; 
            }
            
            if (typeof logUserActivity === "function") {
                logUserActivity(document.title || "หน้าต่างย่อย", "เปิดดูหน้าต่าง");
            }
            
            // ตั้งเวลาให้แอบเช็คหลังบ้านทุกๆ 1 นาที 
            setInterval(checkLoginExpiration, 60000); 
        }
    });

    function logUserActivity(pageName, actionName, detailsStr = "") {
        const scriptUrl = SCRIPT_URL; 
        const currentUser = localStorage.getItem('lab_logged_in_user') || "ไม่ระบุชื่อ (Guest)";
        
        const logPayload = {
            user: currentUser,
            page: pageName,
            action: actionName,
            details: detailsStr
        };

        const formData = new URLSearchParams();
        formData.append('action', 'logActivity');
        formData.append('data', JSON.stringify(logPayload));

        fetch(scriptUrl, { method: 'POST', body: formData })
            .catch(error => console.error("Log Error:", error));
    }
