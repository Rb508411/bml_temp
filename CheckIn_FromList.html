<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLab Training - Course List</title>
    <style>
        /* ธีม Console Gaming UI */
        body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background-color: #0F172A; color: #1E293B; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 600px; background-color: #FFFFFF; box-shadow: 0 0 40px rgba(56, 189, 248, 0.15); display: flex; flex-direction: column; position: relative; }
        
        .logo-container { text-align: center; padding-top: 25px; padding-bottom: 15px; background-color: #FFFFFF; }
        .logo-container img { max-height: 75px; width: auto; object-fit: contain; }
        
        .header { background: linear-gradient(135deg, #0F172A, #1D4ED8); color: #FFFFFF; padding: 20px; text-align: center; border-bottom: 3px solid #10B981; }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        .content { padding: 25px; flex-grow: 1; background-color: #F8FAFC; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #334155; font-size: 0.95rem; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px 15px; border: 2px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; 
            font-size: 1rem; color: #0F172A; background-color: #FFFFFF; transition: all 0.3s ease; 
        }
        .form-group input:focus, .form-group select:focus { border-color: #38BDF8; outline: none; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .form-group input[readonly] { background-color: #F1F5F9; color: #64748B; cursor: not-allowed; border-color: #CBD5E1; }
        
        .btn-primary { 
            width: 100%; background: linear-gradient(90deg, #1D4ED8, #2563EB); color: #FFFFFF; border: none; padding: 15px; border-radius: 8px; 
            font-size: 1.1rem; font-weight: 800; cursor: pointer; margin-top: 10px; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }
        .btn-primary:hover { background: linear-gradient(90deg, #2563EB, #38BDF8); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); transform: translateY(-2px); }
        
        .btn-secondary { 
            background-color: #64748B; color: #FFFFFF; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom:10px; 
            box-shadow: 0 4px 10px rgba(100, 116, 139, 0.2); transition: all 0.3s ease; 
        }
        .btn-secondary:hover { background-color: #38BDF8; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); transform: translateY(-2px); }
        
        .view-section { display: none; }
        .active-view { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; font-size: 0.9rem; background-color: #FFFFFF; border-radius: 8px; overflow: hidden; border: 1px solid #E2E8F0; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #E2E8F0; text-align: left; color: #334155; }
        th { background-color: #0F172A; color: #FFFFFF; border-bottom: none; font-weight: 600; letter-spacing: 0.5px;}
        tr:last-child td { border-bottom: none; }
        tr.course-row { cursor: pointer; transition: all 0.2s ease; }
        tr.course-row:hover { background-color: #F0F9FF; }
        tr.course-row:hover td { color: #0EA5E9; }

        #overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.92); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9999; border-radius: inherit;}
        .spinner { border: 5px solid #E2E8F0; border-top: 5px solid #38BDF8; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="overlay"><div class="spinner"></div><h2 style="color:#1E4ED8; margin-top:15px; font-weight:800;" id="overlay-text">LOADING...</h2></div>
        
        <div class="logo-container">
            <img src="https://storage.googleapis.com/nh-uat-corp/2024/6/update_N_Health_d5a05fd0a9/update_N_Health_d5a05fd0a9.png" alt="N Health Logo">
        </div>
        <div class="header">
            <h1>ระบบลงนามเข้ารับการสื่อสาร<br><small style="font-size:0.95rem; font-weight:normal; color:#38BDF8; letter-spacing: 2px;">BML/NNG Communiction CENTER</small></h1>
        </div>

        <div class="content">
            
            <!-- User Profile Bar -->
            <div style="background-color: #FFFFFF; padding: 15px; border-radius: 10px; margin-bottom: 25px; overflow: hidden; border: 2px solid #E2E8F0; display:flex; justify-content:space-between; align-items:center;">
                <div style="font-weight: 800; color: #1E293B; font-size:1.1rem;" id="user-name">กำลังโหลดข้อมูล...</div>
            </div>

            <!-- VIEW 1: COURSE LIST -->
            <div id="view-course-list" class="view-section active-view">
                <button class="btn-secondary" style="width:auto;" onclick="goToMainMenu()">⬅️ กลับหน้าหลัก</button>
                <h3 style="color:#0F172A; font-weight:800;">📅 รายการคลาส</h3>
                <p style="font-size: 0.9rem; color: #64748B;">* คลิกที่คลาสที่คุณต้องการลงนาม</p>
                
                <div style="overflow-x: auto;">
                    <table id="course-list-table">
                        <thead><tr><th>วันที่-เวลา</th><th>รหัสคลาส</th><th>หัวข้อ</th><th>ผู้สอน</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- VIEW 2: CONFIRM SIGN IN -->
            <div id="view-confirm-signin" class="view-section">
                <button class="btn-secondary" style="width:auto;" onclick="switchView('view-course-list')">⬅️ กลับหน้ารายการคลาส</button>
                <h3 style="color:#0F172A; font-weight:800;">✍️ ยืนยันการลงนาม</h3>
                
                <div class="form-group">
                    <label>รหัสคอร์ส</label>
                    <input type="text" id="s-code" readonly style="font-weight:bold; font-size:1.2rem; text-align:center; letter-spacing: 2px;">
                </div>
                
                <div class="form-group" style="background-color: #F8FAFC; padding: 15px; border-radius: 8px; border: 1px solid #E2E8F0; margin-bottom: 20px;">
                    <label style="color: #64748B; font-size: 0.85rem; margin-bottom: 5px;">หัวข้อ:</label>
                    <div id="s-topic" style="font-weight:bold; color:#1E293B; margin-bottom: 10px;">-</div>
                    <label style="color: #64748B; font-size: 0.85rem; margin-bottom: 5px;">ผู้บรรยาย:</label>
                    <div id="s-instructor" style="font-weight:bold; color:#1E293B;">-</div>
                </div>

                <div class="form-group">
                    <label>สถานะการเข้าร่วมของคุณ</label>
                    <select id="s-status">
                        <option value="เข้าร่วมแบบสด (Live)">เข้าร่วมแบบสด (Live)</option>
                        <option value="ติดตามย้อนหลัง (VOD)">ติดตามย้อนหลัง (VOD)</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="submitSignIn()">บันทึกการลงนาม</button>
            </div>

        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqF92ZskKUgd398CIP0Np1yEYozv4_ew7wJ9IicnEtDCxefZb4zVTGAxo-7WB9zxIT/exec"; // นำ URL ของ Web App มาใส่ตรงนี้
        
        let currentUser = { id: "", name: "", role: "" };

        function showOverlay(text) { document.getElementById('overlay-text').innerText = text; document.getElementById('overlay').style.display = 'flex'; }
        function hideOverlay() { document.getElementById('overlay').style.display = 'none'; }
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
        }
        function goToMainMenu() { window.location.href = "https://rb508411.github.io/bml_temp/LongName_BML.html"; }

        function sendLog(actionName, detailsStr) {
            if(!currentUser.id) return;
            fetch(`${SCRIPT_URL}?action=logActivity&empId=${currentUser.id}&activity=${encodeURIComponent(actionName)}&details=${encodeURIComponent(detailsStr)}`).catch(()=>{});
        }

        window.onload = function() {
            // เช็กข้อมูล Login จาก localStorage
            const empId = localStorage.getItem('bml_emp_id');
            const empName = localStorage.getItem('bml_emp_name');
            const empRole = localStorage.getItem('bml_emp_role');
            
            if(!empId) {
                alert("กรุณาเข้าสู่ระบบก่อนใช้งาน");
                window.location.href = "https://rb508411.github.io/bml_temp/LongName_BML.html"; // ถ้าไม่ได้ Login เด้งกลับหน้าแรก
                return;
            }
            
            currentUser = { id: empId, name: empName, role: empRole };
            document.getElementById('user-name').innerText = `${empName} (${empId})`;
            
            // ดึงรายการคลาสทันทีที่โหลดหน้าเสร็จ
            fetchCourseList();
        };

        async function fetchCourseList() {
            showOverlay("LOADING COURSES...");
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getCourseList`);
                const data = await res.json();
                if(data.success) {
                    const tbody = document.querySelector('#course-list-table tbody');
                    tbody.innerHTML = "";
                    if(data.courses.length === 0) {
                        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding: 20px;'>ยังไม่มีรหัสการสื่อสารในระบบ</td></tr>";
                    } else {
                        data.courses.forEach(c => {
                            tbody.innerHTML += `
                            <tr class="course-row" onclick="selectCourse('${c.code}', '${c.topic}', '${c.instructor}')">
                                <td>${c.date}<br><small style="color:#64748B;">${c.time} น.</small></td>
                                <td style="font-weight:bold; color:#1D4ED8;">${c.code}</td>
                                <td>${c.topic}</td>
                                <td>${c.instructor}</td>
                            </tr>`;
                        });
                    }
                } else { alert("เกิดข้อผิดพลาดในการดึงข้อมูลคลาส"); }
            } catch(e) { alert("เชื่อมต่อล้มเหลว"); }
            hideOverlay();
        }

        // เมื่อคลิกเลือกคลาส
        function selectCourse(code, topic, instructor) {
            document.getElementById('s-code').value = code;
            document.getElementById('s-topic').innerText = topic;
            document.getElementById('s-instructor').innerText = instructor;
            switchView('view-confirm-signin'); // สลับไปหน้ายืนยัน
        }

        // กดยืนยันลงนาม
        async function submitSignIn() {
            const payload = {
                empId: currentUser.id,
                courseCode: document.getElementById('s-code').value,
                status: document.getElementById('s-status').value
            };

            showOverlay("SAVING...");
            try {
                const res = await fetch(`${SCRIPT_URL}?action=signIn&data=${encodeURIComponent(JSON.stringify(payload))}`);
                const data = await res.json();
                if(data.success) {
                    alert("✅ ลงนามเข้ารับการสื่อสารเรียบร้อยแล้ว");
                    sendLog("Sign In", `ลงนาม ${payload.courseCode} (จากรายการ)`);
                    window.location.href = "https://rb508411.github.io/bml_temp/LongName_BML.html"; // กลับไปหน้าเมนูหลักอัตโนมัติ
                } else alert("❌ ผิดพลาด: " + data.message);
            } catch(e) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); }
            hideOverlay();
        }
    </script>
</body>
</html>
